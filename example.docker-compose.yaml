services:
  logwatch:
    image: python:3.12-slim
    container_name: webpage-logwatch
    restart: unless-stopped
    command: sh -c "pip install -q --no-cache-dir docker anthropic && python -u /app/logwatch.py"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /share/Data/config/logwatch/logwatch.py:/app/logwatch.py:ro

      # store the running log analysis data in the apps directory
      - /share/Data/config/webpage/logwatch-data:/data

    # all the secrets so you don't have them published 
    env_file: /share/Data/config/logwatch/.env

    environment:
      - TZ=America/Costa_Rica
      - TARGET_CONTAINER=webpage
      - APP_NAME=webpage
      - APP_DESC=My website
      - PROBE_IGNORE=^/admin$
      - MODE=hybrid
      - RUN_AT=07:00
      - RUN_ON_START=1
      - SEND_IF_CLEAR=1
      - AUTO_IGNORE_HOME=1
      - AUTO_IGNORE_LAN=1

  webpage:
    image: webpage:latest
    container_name: webpage
    restart: unless-stopped
    user: "1000:100"
    ports:
      - "8088:8080"
    environment:
      - TZ=America/Costa_Rica
    volumes:
      - /share/Data/config/webpage:/data
